<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a120b">
<meta name="mobile-web-app-capable" content="yes">

<title>Retro DR Radio</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
  -webkit-user-select:none;
  -webkit-touch-callout:none;
}

html, body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:system-ui,sans-serif;
  background:#1a120b;
  color:#f5efe6;
  touch-action:manipulation;
  overscroll-behavior:none;
}

.radio-wrap{
  display:flex;
  align-items:center;
  justify-content:center;
  width:100vw;
  height:100vh;
}

:root{
  --radio-scale:0.9;
}

.radio{
  position:relative;
  width:min(1200px,97vw);
  padding:46px;
  border-radius:40px;
  background:linear-gradient(180deg,#4b2e1a,#2f1a0e);
  border:6px solid #2a160a;
  box-shadow:
    inset 0 0 0 3px #8b5a2b,
    0 40px 80px rgba(0,0,0,.7);
  transform:scale(var(--radio-scale));
  transform-origin:center center;
}

.radio::after,
.radio::before{
  content:"";
  position:absolute;
  bottom:-18px;
  width:36px;
  height:18px;
  border-radius:50%;
  background:#3b2413;
}

.radio::before{left:40px;}
.radio::after{right:40px;}

.display{
  background:#020800;
  border-radius:22px;
  padding:26px;
  font-size:46px;
  line-height:1;
  height:calc(46px + 26px * 2);
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  margin-bottom:34px;
  border:3px solid #8b5a2b;
  font-family:"Courier New",monospace;
  letter-spacing:2px;
}

.display.on{
  color:var(--led,#00ccff);
  text-shadow:
    0 0 10px var(--led,#00ccff),
    0 0 20px var(--led,#00ccff),
    0 0 32px rgba(0,204,255,.55);
  animation:ledPulse 2.6s ease-in-out infinite;
}

.display.off{
  color:#707070;
}

.display.poweroff{
  color:#d8d8d8;
}

@keyframes ledPulse{
  0%,100%{filter:brightness(1.05);}
  50%{filter:brightness(1.25);}
}

.buttons{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:30px;
}

button{
  font-size:44px;
  padding:40px 0;
  border-radius:28px;
  border:3px solid #8b5a2b;
  background:linear-gradient(180deg,#c77c3c,#8b5a2b);
  color:#f5efe6;
  cursor:pointer;
  touch-action:manipulation;
}

button:active{
  transform:scale(.98);
}

button.active{
  background:linear-gradient(180deg,#ffd966,#b38f1d);
  color:#120a05;
}

.center-row{
  margin-top:40px;
  display:grid;
  grid-template-columns:1fr auto 1fr;
  gap:28px;
  align-items:center;
}

.speaker{
  height:110px;
  border-radius:20px;
  background:
    radial-gradient(circle at 2px 2px,#00000055 20%,transparent 21%) 0 0/10px 10px,
    linear-gradient(180deg,#5a3a1e,#3b2413);
  border:3px solid #8b5a2b;
}

.mute{
  font-size:48px;
  width:240px;
  height:140px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:none;
  border-radius:30px;
  color:#fff;
  cursor:pointer;
}

.mute.offstate{
  background:linear-gradient(180deg,#ff4c4c,#b31f1f);
}

.mute.onstate{
  background:linear-gradient(180deg,#39d98a,#0e8a4f);
}

.volume{
  margin-top:46px;
}

.volume-header{
  display:flex;
  justify-content:space-between;
  font-size:34px;
  margin-bottom:22px;
}

input[type=range]{
  width:100%;
  height:40px;
  -webkit-appearance:none;
  appearance:none;
  background:#3b2413;
  border-radius:20px;
  border:3px solid #8b5a2b;
}

input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;
  appearance:none;
  width:136px;
  height:136px;
  border-radius:50%;
  background:linear-gradient(180deg,#ffd966,#b38f1d);
  border:4px solid #2a160a;
}

audio{
  display:none;
}

@media (orientation:portrait){
  :root{--radio-scale:0.78;}

  .radio{
    padding:40px;
  }

  .buttons{
    grid-template-columns:1fr 1fr;
    gap:26px;
  }

  #btnP5{
    grid-column:1 / -1;
  }

  button{
    font-size:42px;
    padding:36px 0;
  }

  .display{
    font-size:44px;
    height:calc(44px + 26px * 2);
  }

  .mute{
    width:240px;
    height:140px;
    font-size:46px;
  }

  .speaker{
    height:100px;
  }

  input[type=range]::-webkit-slider-thumb{
    width:128px;
    height:128px;
  }
}

@media (orientation:landscape){
  :root{--radio-scale:0.92;}
}

@media (max-height:720px){
  :root{--radio-scale:0.80;}
}

/* ========= NATVISNING 01:00–06:00 ========= */
#nightScreen{
  position:fixed;
  inset:0;
  z-index:99999;
  display:none;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at 50% 25%, rgba(80,110,180,.18), transparent 35%),
    linear-gradient(180deg,#071225,#0b1d3a 55%,#06101f);
  color:#f3f6ff;
  text-align:center;
  padding:24px;
}

#nightScreen.show{
  display:flex;
}

.night-content{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:18px;
}

.night-moon{
  font-size:110px;
  line-height:1;
  filter:drop-shadow(0 0 22px rgba(220,230,255,.25));
}

.night-title{
  font-size:clamp(48px,8vw,92px);
  font-weight:800;
  letter-spacing:1px;
}

.night-clock{
  margin-top:8px;
  font-family:"Courier New",monospace;
  font-size:clamp(42px,7vw,78px);
  font-weight:700;
  letter-spacing:3px;
  color:#dbe7ff;
}

.night-hint{
  margin-top:8px;
  font-size:clamp(20px,3vw,34px);
  color:#b9c8e8;
}

</style>
</head>

<body>

<div id="nightScreen" aria-live="polite">
  <div class="night-content">
    <div class="night-moon" aria-hidden="true">🌙</div>
    <div class="night-title">Det er nat</div>
    <div class="night-clock" id="nightClock">Kl. 01.00</div>
  </div>
</div>


<div class="radio-wrap">
  <div class="radio">

    <div class="display off" id="display">KLAR</div>

    <div class="buttons">
      <button id="btnP1">P1</button>
      <button id="btnP2">P2</button>
      <button id="btnP5">P5 Nordjylland</button>
    </div>

    <div class="center-row">
      <div class="speaker"></div>
      <button class="mute offstate" id="btnMute">SLUK</button>
      <div class="speaker"></div>
    </div>

    <div class="volume">
      <div class="volume-header">
        <span>Lydstyrke</span>
        <span id="volText">60</span>
      </div>
      <input id="vol" type="range" min="0" max="100" value="60">
    </div>

    <audio id="audio" playsinline></audio>

  </div>
</div>

<script>
/* ========= FULLSCREEN / KIOSK ========= */
let isFullScreen = false;

function goFullScreen(){
  if(isFullScreen) return;

  const el = document.documentElement;

  if(el.requestFullscreen){
    el.requestFullscreen().catch(() => {});
  }else if(el.webkitRequestFullscreen){
    el.webkitRequestFullscreen();
  }

  isFullScreen = true;
}

document.addEventListener("click", goFullScreen, { once:true });
document.addEventListener("touchstart", goFullScreen, { once:true });

document.addEventListener("fullscreenchange", () => {
  isFullScreen = !!document.fullscreenElement;
});

document.addEventListener("webkitfullscreenchange", () => {
  isFullScreen = !!document.webkitFullscreenElement;
});

/* Bloker højreklik / lang menu */
document.addEventListener("contextmenu", e => {
  e.preventDefault();
});

/* Bloker drag */
document.addEventListener("dragstart", e => {
  e.preventDefault();
});

/* Bloker tekstmarkering */
document.addEventListener("selectstart", e => {
  e.preventDefault();
});

/* ========= ZOOM LOCK ========= */
document.addEventListener("gesturestart", e => {
  e.preventDefault();
});

document.addEventListener("touchmove", e => {
  if(e.touches.length > 1){
    e.preventDefault();
  }
}, { passive:false });

let lastTouchEnd = 0;

document.addEventListener("touchend", e => {
  const now = Date.now();

  if(now - lastTouchEnd <= 300){
    e.preventDefault();
  }

  lastTouchEnd = now;
}, false);

/* ========= RADIO ========= */
const audio = document.getElementById("audio");
const display = document.getElementById("display");
const btnMute = document.getElementById("btnMute");
const btnP1 = document.getElementById("btnP1");
const btnP2 = document.getElementById("btnP2");
const btnP5 = document.getElementById("btnP5");

const streams = {
  p1: "https://live-icy.dr.dk/A/A03H.mp3",
  p2: "https://live-icy.dr.dk/A/A04H.mp3",
  p5: "https://live-icy.dr.dk/A/A18H.mp3"
};

const led = {
  p1: "#00ccff",
  p2: "#2e7bff",
  p5: "#19d2ff"
};

let poweredOff = false;
let lastChannel = "p1";

function setDisplay(state, text, channel){
  display.textContent = text;
  display.className = "display " + state;

  if(state === "on"){
    display.style.setProperty("--led", led[channel] || "#00ccff");
  }else{
    display.style.removeProperty("--led");
  }
}

function setActiveButton(ch){
  btnP1.classList.toggle("active", ch === "p1");
  btnP2.classList.toggle("active", ch === "p2");
  btnP5.classList.toggle("active", ch === "p5");
}

async function play(ch){
  poweredOff = false;
  lastChannel = ch;

  btnMute.textContent = "SLUK";
  btnMute.className = "mute offstate";

  audio.pause();
  audio.src = streams[ch];
  audio.load();

  try{
    await audio.play();
    setDisplay("on", "DR " + ch.toUpperCase(), ch);
    setActiveButton(ch);
  }catch{
    setDisplay("off", "TRYK IGEN");
  }
}

btnP1.onclick = () => play("p1");
btnP2.onclick = () => play("p2");
btnP5.onclick = () => play("p5");

btnMute.onclick = () => {
  if(poweredOff){
    play(lastChannel || "p1");
    return;
  }

  audio.pause();
  poweredOff = true;

  btnMute.textContent = "TÆND";
  btnMute.className = "mute onstate";

  setActiveButton("");
  setDisplay("poweroff", "SLUKKET");
};

/* ========= VOLUME ========= */
const vol = document.getElementById("vol");
const volText = document.getElementById("volText");

function applyVolumeFromSlider(value0to100){
  const v = value0to100 / 100;
  const boost = 1.35;
  const shaped = Math.pow(v, 0.55);

  audio.volume = Math.min(1, shaped * boost);
}

vol.oninput = e => {
  const val = Number(e.target.value);
  applyVolumeFromSlider(val);
  volText.textContent = val;
};

applyVolumeFromSlider(Number(vol.value));


/* ========= NATVISNING 01:00–06:00 ========= */
const nightScreen = document.getElementById("nightScreen");
const nightClock = document.getElementById("nightClock");
let nightModeActive = false;

function isNightTime(date = new Date()){
  const hour = date.getHours();
  return hour >= 1 && hour < 6;
}

function updateNightMode(){
  const now = new Date();
  const shouldShowNight = isNightTime(now);

  if(shouldShowNight){
    nightClock.textContent =
      "Kl. " +
      String(now.getHours()).padStart(2, "0") +
      "." +
      String(now.getMinutes()).padStart(2, "0");

    if(!nightModeActive){
      // Stop radioen om natten, men start den ikke automatisk igen kl. 06.
      audio.pause();
      poweredOff = true;
      btnMute.textContent = "TÆND";
      btnMute.className = "mute onstate";
      setActiveButton("");
      setDisplay("poweroff", "SLUKKET");
    }

    nightScreen.classList.add("show");
    nightModeActive = true;
  }else{
    nightScreen.classList.remove("show");
    nightModeActive = false;
  }
}

// Tjek straks ved opstart og derefter hvert 15. sekund,
// så skiftet kl. 01.00 og 06.00 sker automatisk uden genstart.
updateNightMode();
setInterval(updateNightMode, 15000);

</script>

</body>
</html>
